name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject accidentally committed game and runtime data
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E -i '(^|/)(default\.xbe|.*\.iso|.*\.xiso|furonlog\.log|recomp_crash\.log|xbox_kernel\.log|dah_event_trace\.jsonl|.*\.dmp)$'; then
            echo "Prohibited game or generated runtime data is tracked."
            exit 1
          fi
      - name: Validate issue forms and project metadata
        shell: python
        run: |
          from pathlib import Path
          required = [
              Path("README.md"), Path("CONTRIBUTING.md"),
              Path("CODE_OF_CONDUCT.md"), Path("SECURITY.md"),
              Path("NOTICE.md"), Path("ACCESSIBILITY.md"),
              Path("CHANGELOG.md"),
              Path(".github/ISSUE_TEMPLATE/bug_report.yml"),
              Path(".github/ISSUE_TEMPLATE/accuracy_report.yml"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing public project files: " + ", ".join(missing))
      - name: Enforce port-integrity classifications and ledger
        shell: bash
        run: |
          set -euo pipefail
          python work/dah-recomp/tools/audit_port_integrity.py \
            --json /tmp/port_integrity_report.json \
            --markdown /tmp/PORT_INTEGRITY_LEDGER.md
          diff -u work/dah-recomp/tools/parity/port_integrity_report.json \
            /tmp/port_integrity_report.json
          diff -u work/dah-recomp/tools/parity/PORT_INTEGRITY_LEDGER.md \
            /tmp/PORT_INTEGRITY_LEDGER.md
      - name: Test run-evidence correlation
        shell: bash
        run: python work/dah-recomp/tools/parity/test_summarize_debug_runs.py
      - name: Test callback evidence and dispatch coverage
        shell: bash
        run: |
          set -euo pipefail
          python work/dah-recomp/tools/test_audit_crash_callbacks.py
          python work/dah-recomp/tools/test_dispatch_table.py
